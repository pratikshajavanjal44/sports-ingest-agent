<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sports Insights Agent</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --accent: #f38020; /* Cloudflare orange */
    --text: #e8e9ec;
    --muted: #9aa0ab;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    height: 85vh;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 16px;
  }
  #config {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  #config input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.4;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #111;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #22262f;
    border: 1px solid var(--border);
  }
  .msg.pending { opacity: 0.6; font-style: italic; }
  form {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  input#messageInput {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14px;
  }
  button {
    background: var(--accent);
    border: none;
    color: #111;
    font-weight: 600;
    border-radius: 8px;
    padding: 0 18px;
    cursor: pointer;
    font-size: 14px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
  <div class="app">
    <h1>Sports Insights Agent</h1>
    <div class="subtitle">Llama 3.3 · Workflows · Durable Objects · Workers AI</div>

    <div id="config">
      <input id="workerUrl" placeholder="Worker URL, e.g. https://sports-ingest-agent.YOUR-SUBDOMAIN.workers.dev" />
    </div>

    <div id="messages"></div>

    <form id="chatForm">
      <input id="messageInput" placeholder="Ask about a team, e.g. 'Tell me about the Lakers'" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

<script>
  const sessionId = crypto.randomUUID();
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("chatForm");
  const input = document.getElementById("messageInput");
  const workerUrlInput = document.getElementById("workerUrl");

  workerUrlInput.value = localStorage.getItem("workerUrl") || "";

  function addMessage(role, text, pending = false) {
    const div = document.createElement("div");
    div.className = "msg " + role + (pending ? " pending" : "");
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    const workerUrl = workerUrlInput.value.trim().replace(/\/$/, "");
    if (!message || !workerUrl) return;

    localStorage.setItem("workerUrl", workerUrl);
    addMessage("user", message);
    input.value = "";
    const pendingEl = addMessage("assistant", "Thinking…", true);

    try {
      const res = await fetch(workerUrl + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, message }),
      });
      const data = await res.json();
      pendingEl.textContent = data.reply || data.error || "No response.";
      pendingEl.classList.remove("pending");
    } catch (err) {
      pendingEl.textContent = "Couldn't reach the agent. Check the Worker URL.";
      pendingEl.classList.remove("pending");
    }
  });
</script>
</body>
</html>
